name: CI

on:
  push:
    branches: [ main, Fastapi, "feature/**", "test/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Tests & Validation qualité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pytest pydantic

      - name: Régénérer la transformation (chunks.parquet)
        run: python transformation/transform_corpus.py

      - name: Lancer les 8 tests automatisés (Hanane Ayar)
        run: pytest tests/ -v

      - name: Lancer la validation qualité
        run: python quality/validate_corpus.py

      - name: Vérifier que le dataset validé existe
        run: |
          if [ ! -f data/validated/chunks.parquet ]; then
            echo "chunks.parquet manquant dans data/validated/"
            exit 1
          fi

  build-docker:
    name: Build de l'image API
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker de l'API (Chbab Brahim)
        run: docker build -f api/Dockerfile -t pipelineforge-api:ci .
